# Drop-in for acres-architecture-worker@.service on the GPU render host only: the job sees the NVIDIA
# devices and nothing else new, renders with Cycles on OptiX, and gets the host's 4 vCPUs and more memory.
# The device nodes exist from boot (acres-gpu-devices.service), since the sandbox cannot create them.
[Service]
Environment=ACRES_CYCLES_DEVICE=OPTIX
PrivateDevices=false
DevicePolicy=closed
DeviceAllow=/dev/nvidiactl rw
DeviceAllow=/dev/nvidia0 rw
DeviceAllow=/dev/nvidia-uvm rw
DeviceAllow=/dev/nvidia-uvm-tools rw
CPUQuota=400%
MemoryMax=12G
